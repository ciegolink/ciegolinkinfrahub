expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 256M
upload_max_filesize = 2G
post_max_size = 2100M
max_input_time = 3600
max_execution_time = 300
date.timezone = ${TZ}
session.save_path = "/var/www/ciegolinkinfrahub/data/sessions"
session.gc_maxlifetime = 28800
session.cookie_httponly = 1
session.use_strict_mode = 1
opcache.enable = 1
opcache.validate_timestamps = 0
