# HTTP only, TLS ends at the reverse proxy
ServerName localhost
<VirtualHost *:80>
    DocumentRoot /var/www/ciegolinkinfrahub/public

    SetEnv HTTPS on

    # client IP from trusted proxies only
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy ${TRUSTED_PROXIES}

    <Directory /var/www/ciegolinkinfrahub>
        AllowOverride None
        Require all denied
    </Directory>
    <Directory /var/www/ciegolinkinfrahub/public>
        Options -Indexes -Includes -ExecCGI -FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>

    # software uploads up to 2 GiB
    LimitRequestBody 2202009600

    # SSH terminal websocket
    ProxyRequests Off
    ProxyPass        /ssh-gateway/ws ws://ssh-gateway:8022/ws
    ProxyPassReverse /ssh-gateway/ws ws://ssh-gateway:8022/ws

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
